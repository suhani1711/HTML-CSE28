<!DOCTYPE html> 
<html lang="en"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Product Grid</title> 
  <style> 
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      background: white; 
      padding: 20px; 
    } 
 
    h1 { 
      text-align: center; 
      margin-bottom: 20px; 
    } 
   
    .grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); /* 4 columns for large screens */ 
      gap: 20px; 
    } 
 
    
    .card { 
      background: white; 
      border-radius: 8px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
      padding: 16px; 
      text-align: center; 
      height : 100%;
      border-color: black;
    } 
 
    .card img { 
      width: 50%; 
      height: 180px; 
      object-fit: cover; 
      border-radius: 6px; 
      margin-bottom: 10px; 
    } 
 
    .card h3 { 
      font-size: 18px; 
      margin: 8px 0; 
    } 
 
    .card p { 
      font-size: 14px; 
      color: gray; 
      margin: 4px 0; 
    } 
 
    .price { 
      font-weight: bold; 
      color: blue; 
    } 
 
    
    @media (max-width: 1024px) { 
      .grid { 
        grid-template-columns: repeat(2, 1fr);
      } 
    } 
 
    @media (max-width: 600px) { 
      .grid { 
        grid-template-columns: 1fr; 
      } 
    } 
  </style> 
</head> 
<body> 
  <h1 style="font-family: 'Times New Roman', Times, serif;">BOYS CLOTHING SETS</h1> 


<div class="grid"> 
    <div class="card"> 
      <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/kids-apparel-combo/w/b/7/2-3-years-fb-red-25-fosen-original-imahgdvfusxf2cep.jpeg?q=70" alt="boys clothing set 1"> 
      <h3>Red hoodie for kids</h3> 
      <p>winter hoodie set for boys </p> 
      <p class="price">₹499</p> 
    </div> 
 
    <div class="card"> 
      <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/kids-apparel-combo/v/x/d/1-2-years-casual-wear-for-kids-aadhyafashion-original-imahg6fymtmtzhe6.jpeg?q=70" alt="clothing set 2"> 
      <h3>Casual Wear for Kids</h3> 
      <p>Baby Boys Casual Shirt Trouser  (White, Light Blue)</p> 
      <p class="price">₹699</p> 
    </div> 
 
    <div class="card"> 
      <img src="https://rukminim2.flixcart.com/image/612/612/xif0q/kids-apparel-combo/d/t/l/4-5-years-pear-peach-dheemhi-original-imahgphtfztxbfze.jpeg?q=70" alt="clothing set 3"> 
      <h3> 3 piece shirt set </h3> 
      <p>comfortable and perfect for summers.</p> 
      <p class="price">₹549</p> 
    </div> 
 
    <div class="card"> 
      <img src="https://m.media-amazon.com/images/I/51vf3APGK6L._AC_UL480_FMwebp_QL65_.jpg" alt="clothing set 4"> 
      <h3>baby body suit </h3> 
      <p>Trendy design with premium quality.</p> 
      <p class="price">₹659</p> 
    </div> 
  </div> 
</body> 
</html>
