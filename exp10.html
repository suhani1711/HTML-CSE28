<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Cart - Your Shopping Companion</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
    }
    header {
        background-color: #111;
        padding: 15px 20px;
        color: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    header h1 {
        margin: 0;
        font-size: 22px;
    }
    nav a {
        color: white;
        margin: 0 12px;
        text-decoration: none;
        font-size: 16px;
    }
    nav a:hover {
        text-decoration: underline;
    }
    .hero {
        padding: 40px;
        background: white;
        text-align: center;
    }
    .hero h2 {
        margin: 0;
        font-size: 28px;
    }
    .section-title {
        text-align: center;
        font-size: 24px;
        margin-top: 30px;
    }
    .products {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 30px;
    }
    .card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        text-align: center;
    }
    .card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 6px;
    }
    footer {
        text-align: center;
        padding: 15px;
        background: #222;
        color: white;
        margin-top: 30px;
    }
</style>
</head>
<body>
<header>
    <h1>Urban Cart</h1>
    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Categories</a>
        <a href="#">Deals</a>
        <a href="#">Contact</a>
    </nav>
    <nav>
        <a href="#">Cart</a>
        <a href="#">Login</a>
    </nav>
</header>

<div class="hero">
    <h2>Welcome to Urban Cart!</h2>
    <p>Your one-stop destination for all shopping needs.</p>
</div>
